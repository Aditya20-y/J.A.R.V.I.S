<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Personal AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f3460;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(15, 52, 96, 0.5);
        }
        
        .header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e94560;
        }
        
        .header h1 {
            font-size: 28px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            color: #aaa;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.jarvis {
            justify-content: flex-start;
        }
        
        .message-text {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        .message.user .message-text {
            background: #e94560;
            color: #fff;
        }
        
        .message.jarvis .message-text {
            background: #0f3460;
            color: #4ecca3;
            border: 1px solid #4ecca3;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 2px solid #0f3460;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #0f3460;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }
        
        #messageInput::placeholder {
            color: #aaa;
        }
        
        #messageInput:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }
        
        button {
            padding: 12px 24px;
            background: #e94560;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #d83a50;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .status {
            text-align: center;
            color: #4ecca3;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .loading {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: #4ecca3;
            border-radius: 50%;
            animation: pulse 1s infinite;
            margin-left: 5px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>J.A.R.V.I.S</h1>
            <p>Personal AI Assistant</p>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message jarvis">
                <div class="message-text">Good morning, Sir. I am J.A.R.V.I.S. How may I assist you today?</div>
            </div>
        </div>
        
        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Type your message here..."
                autocomplete="off"
            >
            <button id="sendBtn" onclick="sendMessage()">Send</button>
            <button onclick="clearHistory()">Clear</button>
        </div>
        
        <div class="status" id="status"></div>
    </div>
    
    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        
        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                sendMessage();
            }
        });
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.focus();
            
            // Show loading
            sendBtn.disabled = true;
            sendBtn.textContent = 'Thinking';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                if (data.jarvis_response) {
                    addMessage(data.jarvis_response, 'jarvis');
                } else if (data.error) {
                    addMessage('I apologize, Sir. An error occurred: ' + data.error, 'jarvis');
                }
            } catch (error) {
                addMessage('I apologize, Sir. Connection error.', 'jarvis');
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }
        }
        
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = text;
            
            messageDiv.appendChild(textDiv);
            chatArea.appendChild(messageDiv);
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        async function clearHistory() {
            if (confirm('Clear conversation history?')) {
                try {
                    await fetch('/api/clear-memory', { method: 'POST' });
                    chatArea.innerHTML = '';
                    addMessage('Memory cleared, Sir.', 'jarvis');
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }
        
        // Check status on load
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                status.textContent = `Status: ${data.status}`;
            } catch (error) {
                status.textContent = 'Status: Connected';
            }
        }
        
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
